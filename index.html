<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --steel:#1b2838; --night:#171a21; --panel:#16202d; --panel2:#1f2733;
  --row:#222d3d; --line:#000000; --edge:#2a3f5a;
  --txt:#c6d4df; --dim:#8f98a0; --dimmer:#68727c; --blu:#66c0f4;
  --grn1:#8ec328; --grn2:#5c7e10; --grngl:#a4d007;
}
html,body{height:100%}
body{
  background:#1b2838;
  color:var(--txt);
  font:400 13px/1.45 "Motiva Sans","Segoe UI",Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:13px;color:var(--txt)}
button{cursor:pointer;border:none;background:none}
a{color:var(--blu);text-decoration:none}
a:hover{color:#fff}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#1b2838}
::-webkit-scrollbar-thumb{background:#3d4450;border:2px solid #1b2838;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#556070}
:focus-visible{outline:1px solid #66c0f4;outline-offset:1px}
.hide{display:none !important}

/* ---------- sign in ---------- */
#auth{
  position:fixed;inset:0;z-index:60;
  background:
    radial-gradient(900px 500px at 50% -10%,rgba(60,116,163,.35),transparent 70%),
    linear-gradient(#1b2838 0%,#171a21 100%);
  display:flex;flex-direction:column;align-items:center;
  overflow:auto;padding:40px 16px 60px;
}
#auth .mark{margin:18px 0 26px}
#auth .mark img{width:232px;image-rendering:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
.authbox{width:100%;max-width:352px;background:rgba(0,0,0,.28);border-radius:3px;padding:22px 24px 26px;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 8px 28px rgba(0,0,0,.45)}
.authtabs{display:flex;gap:22px;margin-bottom:18px;border-bottom:1px solid rgba(255,255,255,.08)}
.authtabs button{padding:0 0 9px;font-size:13px;letter-spacing:.7px;text-transform:uppercase;color:#7b8a99}
.authtabs button.on{color:#fff;box-shadow:inset 0 -2px 0 #66c0f4}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:#7b8a99;margin-bottom:5px}
.field input{width:100%;background:#32353c;border:none;border-radius:2px;padding:9px 10px;color:#fff}
.field input:focus{background:#3a3e46;outline:none;box-shadow:0 0 0 1px #66c0f4}

.main{flex:1;overflow:auto;min-width:0;position:relative}

/* ---------- game page ---------- */
.hero{position:relative;height:280px;background:#16202d;overflow:hidden}

.heroart .fb{padding:10px}
.heroart .fb b{font-size:13px}
.hero .name{font-size:32px;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.85);line-height:1.1}

.actionbar{display:flex;align-items:center;gap:20px;padding:14px 28px;background:linear-gradient(#1b2838,#19222e);border-bottom:1px solid #0f1720}
.playbtn{
  min-width:150px;padding:11px 26px;border-radius:2px;color:#fff;font-size:16px;letter-spacing:.6px;
  background:linear-gradient(to bottom,#8ac927 0%,#5c8b12 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 3px rgba(0,0,0,.5);
}
.playbtn:hover{background:linear-gradient(to bottom,#a2e232 0%,#6ea318 100%)}

.iconbtn{width:34px;height:34px;border-radius:2px;background:#2d3844;color:#a7b4c0;font-size:14px}
.iconbtn:hover{background:#3b4959;color:#fff}
.stat{font-size:12px;color:#7d8a96;line-height:1.5}
.stat b{display:block;font-size:14px;color:#dfe7ee;font-weight:400}
.cols{display:grid;grid-template-columns:1fr 268px;gap:26px;padding:22px 28px 40px;align-items:start}
.card{background:#16202d;border:1px solid #0f1821;border-radius:2px;margin-bottom:16px}
.card h3{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#8ea0b0;font-weight:400;padding:11px 14px;border-bottom:1px solid #0f1821;background:#1a2431}
.card .in{padding:14px}
.card p{font-size:13px;line-height:1.75;color:#a9b7c4;white-space:pre-wrap;word-break:break-word}

.kv span{color:#78848f}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{background:#2a3a4a;color:#9fb6c9;font-size:11px;padding:3px 9px;border-radius:2px}
.tag:hover{background:#3a5069;color:#fff}
.linkrow{display:block;width:100%;text-align:left;padding:8px 14px;font-size:12.5px;color:#a3b2bf;border-bottom:1px solid #121b25}
.linkrow:hover{background:#1f2c3a;color:#fff}
.linkrow:last-child{border-bottom:none}
.linkrow.warn:hover{background:#4a1f1f;color:#ffbdbd}

/* ---------- modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,17,.72);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto}
.dlg{width:100%;max-width:560px;background:#1b2838;border:1px solid #000;border-radius:3px;box-shadow:0 18px 60px rgba(0,0,0,.7)}
.dlg.wide{max-width:720px}
.dlg .hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(#2b3a4c,#22303f);border-bottom:1px solid #0c1319}
.dlg .hd h2{font-size:14px;font-weight:400;letter-spacing:.8px;text-transform:uppercase;color:#e3ecf3}
.dlg .hd button{color:#8b97a3;font-size:15px;padding:2px 6px}
.dlg .hd button:hover{color:#fff}
.dlg .bd{padding:18px 18px 6px;max-height:64vh;overflow:auto}
.dlg .ft{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid #0f1821;background:#19222e}
.btn{padding:8px 18px;border-radius:2px;background:#3d4450;color:#dce3ea;font-size:13px}
.btn:hover{background:#4c5563;color:#fff}
.btn.pri{background:linear-gradient(to bottom,#7cb322,#587f16);color:#fff}
.btn.pri:hover{background:linear-gradient(to bottom,#93cf2c,#6b9a1a)}
.btn.dngr{background:#4a2020;color:#f0b8b8}
.btn.dngr:hover{background:#6c2a2a;color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.drop{border:2px dashed #33465a;border-radius:3px;padding:26px 16px;text-align:center;color:#7d8b98;font-size:13px;background:#16202d;cursor:pointer}
.drop:hover,.drop.over{border-color:#66c0f4;color:#c6d4df;background:#182534}
.drop b{display:block;color:#dbe5ed;font-size:14px;font-weight:400;margin-bottom:4px}
.drop .fn{color:#86c332;margin-top:8px;font-size:12px;word-break:break-all}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field textarea{width:100%;background:#32353c;border:none;border-radius:2px;padding:9px 10px;color:#fff;resize:vertical;min-height:74px;line-height:1.6}
.field textarea:focus,.field select:focus{outline:none;box-shadow:0 0 0 1px #66c0f4}
.field select{width:100%;background:#32353c;border:none;border-radius:2px;padding:9px 10px}
.coverpick{display:flex;gap:14px;align-items:flex-start}
.coverpick .pv{width:92px;height:138px;flex:none;background:#20303f;border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#5d6a77;font-size:11px;text-align:center;padding:6px}
.coverpick .pv img{width:100%;height:100%;object-fit:cover}
.seg{display:flex;gap:2px;margin-bottom:16px;background:#141d27;padding:3px;border-radius:2px;width:fit-content}
.seg button{padding:6px 14px;font-size:12px;color:#8e9aa6;border-radius:2px}
.seg button.on{background:#2a475e;color:#fff}
.settabs{display:flex;gap:0;border-bottom:1px solid #0f1821;margin:-18px -18px 18px;background:#16202d}
.settabs button{padding:11px 16px;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:#7f8c99}
.settabs button.on{color:#fff;background:#1b2838;box-shadow:inset 0 -2px 0 #66c0f4}
.note{font-size:11.5px;color:#6d7883;line-height:1.7;margin-top:10px}

/* ---------- play overlay ---------- */
#play{position:fixed;inset:0;z-index:70;background:#0e1319;display:flex;flex-direction:column}
#play .bar{height:38px;flex:none;background:#171a21;display:flex;align-items:center;gap:14px;padding:0 10px;border-bottom:1px solid #000}
#play .bar .back{padding:5px 12px;background:#2d3844;border-radius:2px;font-size:12px;color:#d3dce4}
#play .bar .back:hover{background:#3d4a59;color:#fff}
#play .bar .ttl{font-size:12.5px;color:#cfdae3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- toast + ctx ---------- */
#toast{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tst{background:#1c2733;border:1px solid #000;border-left:3px solid #86c332;padding:10px 14px;font-size:12.5px;color:#d6e0e8;box-shadow:0 6px 20px rgba(0,0,0,.6);max-width:300px}
.tst.bad{border-left-color:#c43b3b}

#ctx button{display:block;width:100%;text-align:left;padding:7px 14px;font-size:12px;color:#bcc6d0}

.prog{height:6px;background:#0f1721;border-radius:3px;overflow:hidden;margin-top:12px}

@media (max-width:820px){
  .side{width:190px}
  .cols{grid-template-columns:1fr}
  .hero{height:200px}

}

  .burger{display:block}
  .side{display:none}
  .side.mob{display:flex;position:absolute;z-index:30;top:78px;bottom:0;left:0}

  .actionbar{padding:12px 14px;gap:14px;flex-wrap:wrap}
}

<body>

<!-- ============ SIGN IN / CREATE ACCOUNT ============ -->
<div id="auth">
  <div class="mark"><img id="authMark" alt="Mist"></div>
  <div class="authbox">
    <div class="authtabs">
      <button id="tabLogin" class="on">Sign in</button>
      <button id="tabSignup">Create account</button>
    </div>

    <form id="loginForm" autocomplete="off">
      <div id="loginErr" class="autherr hide"></div>
      <div class="field">
        <label for="liUser">Account name</label>
        <input id="liUser" type="text" spellcheck="false">
      </div>
      <div class="field">
        <label for="liPass">Password</label>
        <input id="liPass" type="password">
      </div>
      <button class="bigbtn" type="submit">Sign in</button>
    </form>

    <form id="signupForm" class="hide" autocomplete="off">
      <div id="signErr" class="autherr hide"></div>
      <div class="field">
        <label for="suUser">Account name</label>
        <input id="suUser" type="text" spellcheck="false" maxlength="32">
        <div class="hint">3–32 characters. This is the name you sign in with.</div>
      </div>
      <div class="field">
        <label for="suPass">Password</label>
        <input id="suPass" type="password">
      </div>
      <div class="field">
        <label for="suPass2">Confirm password</label>
        <input id="suPass2" type="password">
      </div>
      <div class="field">
        <label>Avatar</label>
        <div class="avatarpick">
          <div class="pv"><img id="suAvaPv" alt=""></div>
          <div>
            <button class="btn" type="button" id="suAvaBtn">Choose image</button>
            <div class="hint">Optional. You can change it later in settings.</div>
          </div>
        </div>
      </div>
      <button class="bigbtn" type="submit">Create my account</button>
    </form>
  </div>
  <div class="authfoot">
    Your account and games stay on this device. Nothing is uploaded anywhere.<br>
    Mist is a local launcher for HTML games you add yourself.
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <div class="nav">
    <button class="wbtn burger" id="menuBtn" title="Library list">&#9776;</button>
    <div class="brand"><img id="navMark" alt="Mist"></div>
    <div class="tabs">
      <button id="tabStore">Store</button>
      <button id="tabLib" class="on">Library</button>
      <button id="tabCom">Community</button>
    </div>
    <span class="sp"></span>
    <button class="userchip" id="userChip">
      <img id="chipAva" alt="">
      <span class="nm" id="chipName">player</span>
      <span class="car">&#9660;</span>
    </button>
    <div class="menu hide" id="userMenu">
      <button data-act="profile">View my profile</button>
      <button data-act="settings">Account settings</button>
      <button data-act="launchsettings">Launch settings&hellip;</button>
      <div class="sep"></div>
      <button data-act="backup">Back up library&hellip;</button>
      <button data-act="restore">Restore from backup&hellip;</button>
      <div class="sep"></div>
      <button data-act="signout">Sign out</button>
    </div>
  </div>

  <div class="body">
    <aside class="side" id="side">
      <div class="searchrow">
        <input id="q" type="search" placeholder="Search by name" spellcheck="false">
        <button class="sortbtn" id="sortBtn" title="Sort">&#9662;</button>
      </div>
      <button class="homerow on" id="homeRow">&#9632;&nbsp; Home</button>
      <div class="sectitle"><span id="listHdr">All games</span><span id="listCount">0</span></div>
      <div class="gamelist" id="gameList"></div>
      <div class="addbar"><button class="addgame" id="addBtn">+ &nbsp;Add a game</button></div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>

<!-- ============ PLAY OVERLAY ============ -->
<div id="play" class="hide">
  <div class="bar">
    <button class="back" id="playBack">&#9664; Library</button>
    <span class="ttl" id="playTitle"></span>
    <span class="sp"></span>
    <span class="clock" id="playClock">0:00</span>
    <button class="iconbtn" id="playFs" title="Fullscreen">&#9974;</button>
  </div>
  <iframe id="playFrame" title="game" allow="autoplay; gamepad; fullscreen; microphone; clipboard-write" allowfullscreen
          sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-pointer-lock allow-downloads"></iframe>
</div>

<div id="modals"></div>
<div id="toast"></div>
<input id="filePick" type="file" class="hide">

<script>

/* ===================================================================
   Mist — local HTML game launcher
   Everything lives on this device: IndexedDB when available,

/* ---------------- storage ---------------- */
const Store = (function(){
  let mode = 'mem', db = null;
  const mem = new Map();

  function openIDB(){
    return new Promise((res,rej)=>{
      let r;
      try { r = indexedDB.open('mist_db',1); } catch(e){ return rej(e); }
      r.onupgradeneeded = ()=>{ r.result.createObjectStore('kv'); };
      r.onsuccess = ()=>res(r.result);
      r.onerror   = ()=>rej(r.error||new Error('idb'));
      setTimeout(()=>rej(new Error('idb timeout')),2500);
    });
  }
  function tx(m,fn){
    return new Promise((res,rej)=>{
      const t = db.transaction('kv',m), s = t.objectStore('kv'), rq = fn(s);
      rq.onsuccess = ()=>res(rq.result);
      rq.onerror   = ()=>rej(rq.error);
    });
  }
  async function init(){
    try{ db = await openIDB(); await tx('readonly',s=>s.get('__probe')); mode='idb'; return mode; }catch(e){ db=null; }
    try{ localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); mode='ls'; return mode; }catch(e){}
    if (window.storage) { mode='ws'; return mode; }
    mode='mem'; return mode;
  }
  async function get(k){
    try{
      if(mode==='idb') { const v = await tx('readonly',s=>s.get(k)); return v===undefined?null:v; }
      if(mode==='ls')  { const v = localStorage.getItem('mist:'+k); return v==null?null:JSON.parse(v); }
      if(mode==='ws')  { const r = await window.storage.get('mist:'+k); return r? JSON.parse(r.value) : null; }
    }catch(e){ return mem.has(k)?mem.get(k):null; }
    return mem.has(k)?mem.get(k):null;
  }
  async function set(k,v){
    mem.set(k,v);
    try{
      if(mode==='idb') return await tx('readwrite',s=>s.put(v,k));
      if(mode==='ls')  return localStorage.setItem('mist:'+k, JSON.stringify(v));
      if(mode==='ws')  return await window.storage.set('mist:'+k, JSON.stringify(v));
    }catch(e){ throw e; }
  }
  async function del(k){
    mem.delete(k);
    try{
      if(mode==='idb') return await tx('readwrite',s=>s.delete(k));
      if(mode==='ls')  return localStorage.removeItem('mist:'+k);
      if(mode==='ws')  return await window.storage.delete('mist:'+k);
    }catch(e){}
  }
  return { init, get, set, del, mode:()=>mode };
})();

/* ---------------- state ---------------- */
const S = { acct:null, games:[], sel:null, view:'home', q:'', sort:'recent',
  settings:{ launchMode:'normal', popupAddress:'blank' } };

const hash = (s)=>{ let h=5381; s='mist$'+s; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(16); };
const uid  = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function playtime(sec){
  if(!sec) return 'Never played';
  if(sec < 75) return 'Less than a minute';
  if(sec < 3600){ const m = Math.round(sec/60); return m + (m===1?' minute':' minutes'); }
  return (sec/3600).toFixed(1) + ' hours';
}
function when(ts){
  if(!ts) return '—';
  const d = new Date(ts), now = new Date(), day = 864e5;
  const midnight = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(ts >= midnight) return 'Today at ' + d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  if(ts >= midnight-day) return 'Yesterday';
  const diff = Math.floor((midnight-ts)/day)+1;
  if(diff < 7) return diff + ' days ago';
  return d.toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'});
}
const kb = (n)=> n>=1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB';

function toast(msg, bad){
  const el = document.createElement('div');
  el.className = 'tst' + (bad?' bad':'');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),420); }, 2600);
}

/* ---------------- files ---------------- */
function pickFile(accept){
  return new Promise(res=>{
    const i = document.createElement('input');
    i.type='file'; i.accept=accept||''; i.style.display='none';
    document.body.appendChild(i);
    i.onchange = ()=>{ const f=i.files&&i.files[0]; i.remove(); res(f||null); };
    i.click();
  });
}
const readText = f => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsText(f); });
const readURL  = f => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });

function fitImage(dataURL, w, h, q){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      const x = c.getContext('2d');
      const r = Math.max(w/img.width, h/img.height);
      const dw = img.width*r, dh = img.height*r;
      x.fillStyle = '#1b2838'; x.fillRect(0,0,w,h);
      x.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
      res(c.toDataURL('image/jpeg', q||0.85));
    };
    img.onerror = ()=>res(dataURL);
    img.src = dataURL;
  });
}

/* ---------------- boot ---------------- */
(async function boot(){
  $('#authMark').src = MARK; $('#navMark').src = MARK;
  $('#suAvaPv').src = DEFAVA;
  await Store.init();
  S.acct = await Store.get('account');
  S.settings = Object.assign({ launchMode:'normal', popupAddress:'blank' }, (await Store.get('settings')) || {});
  // Mist always asks for your password on launch — it only remembers the
  // account itself (so the sign-in name is prefilled), never the session.
  if(!S.acct){ switchAuth('signup'); }
  else { switchAuth('login'); $('#liUser').value = S.acct.user; $('#liPass').focus(); }
  if(Store.mode()==='mem') toast('Storage is blocked here — this session will not be saved.', true);
})();

/* ---------------- auth screen ---------------- */
let newAvatar = null;
function switchAuth(which){
  const login = which === 'login';
  $('#tabLogin').classList.toggle('on', login);
  $('#tabSignup').classList.toggle('on', !login);
  $('#loginForm').classList.toggle('hide', !login);
  $('#signupForm').classList.toggle('hide', login);
  (login ? $('#liUser') : $('#suUser')).focus();
}
$('#tabLogin').onclick  = ()=>switchAuth('login');
$('#tabSignup').onclick = ()=>switchAuth('signup');

$('#suAvaBtn').onclick = async ()=>{
  const f = await pickFile('image/*'); if(!f) return;
  newAvatar = await fitImage(await readURL(f), 128, 128, 0.88);
  $('#suAvaPv').src = newAvatar;
};

function authErr(el, msg){
  const box = $(el);
  if(!msg){ box.classList.add('hide'); return; }
  box.textContent = msg; box.classList.remove('hide');
}

$('#signupForm').onsubmit = async (e)=>{
  e.preventDefault();
  const u = $('#suUser').value.trim(), p = $('#suPass').value, p2 = $('#suPass2').value;
  if(u.length < 3)  return authErr('#signErr','Pick an account name with at least 3 characters.');
  if(p.length < 4)  return authErr('#signErr','Your password needs at least 4 characters.');
  if(p !== p2)      return authErr('#signErr','The two passwords do not match.');
  authErr('#signErr', null);
  S.acct = { user:u, name:u, pass:hash(p), avatar:newAvatar||DEFAVA, created:Date.now() };
  await Store.set('account', S.acct);
  await Store.set('games', []);
  await enterApp();
  toast('Welcome to Mist, ' + u + '.');
};

$('#loginForm').onsubmit = async (e)=>{
  e.preventDefault();
  const u = $('#liUser').value.trim(), p = $('#liPass').value;
  if(!S.acct) return authErr('#loginErr','No account on this device yet. Create one first.');
  if(u.toLowerCase() !== S.acct.user.toLowerCase() || hash(p) !== S.acct.pass)
    return authErr('#loginErr','That account name and password do not match.');
  authErr('#loginErr', null);
  $('#liPass').value = '';
  await enterApp();
};

async function enterApp(){
  S.games = (await Store.get('games')) || [];
  $('#auth').classList.add('hide');
  $('#app').classList.remove('hide');
  paintUser();
  S.view='home'; S.sel=null;
  renderSidebar(); render();
}
function paintUser(){
  $('#chipAva').src  = S.acct.avatar || DEFAVA;
  $('#chipName').textContent = S.acct.name || S.acct.user;
}
async function signOut(){
  $('#app').classList.add('hide');
  $('#auth').classList.remove('hide');
  switchAuth('login');
  $('#liUser').value = S.acct.user; $('#liPass').value=''; $('#liPass').focus();
}

/* ---------------- library data ---------------- */
const saveGames = ()=> Store.set('games', S.games);
const game = id => S.games.find(g=>g.id===id);

function sorted(){
  const list = S.games.filter(g=>{
    const q = S.q.trim().toLowerCase();
    return !q || g.title.toLowerCase().includes(q) || (g.author||'').toLowerCase().includes(q);
  });
  const by = {
    recent: (a,b)=> (b.lastPlayed||b.added) - (a.lastPlayed||a.added),
    name:   (a,b)=> a.title.localeCompare(b.title),
    time:   (a,b)=> (b.secs||0) - (a.secs||0),
    added:  (a,b)=> b.added - a.added
  }[S.sort];
  return list.sort(by);
}

/* ---------------- sidebar ---------------- */
function renderSidebar(){
  const list = sorted();
  $('#listCount').textContent = S.games.length;
  $('#listHdr').textContent = S.q ? 'Results' : 'All games';
  $('#homeRow').classList.toggle('on', S.view==='home');
  const gl = $('#gameList');
  if(!list.length){
    gl.innerHTML = '<div class="glempty">' + (S.games.length ? 'Nothing matches that search.' : 'No games yet. Add an HTML file to start your library.') + '</div>';
    return;
  }
  gl.innerHTML = list.map(g=>
    '<button class="glrow'+(S.sel===g.id&&S.view==='game'?' on':'')+'" data-id="'+g.id+'">'+
      (g.cover ? '<img class="ic" src="'+g.cover+'" alt="">' : '<span class="ic lt">'+esc(g.title.slice(0,1))+'</span>')+
      '<span class="nm">'+esc(g.title)+'</span>'+
    '</button>').join('');
  $$('.glrow', gl).forEach(b=>{
    b.onclick = ()=> openGame(b.dataset.id);
    b.oncontextmenu = (e)=>{ e.preventDefault(); contextMenu(e.clientX, e.clientY, b.dataset.id); };
  });
}

/* ---------------- views ---------------- */
function render(){
  const m = $('#main');
  m.scrollTop = 0;
  if(S.view==='game')      m.innerHTML = viewGame(game(S.sel));
  else if(S.view==='store')m.innerHTML = viewStore();
  else if(S.view==='com')  m.innerHTML = viewProfile();
  else                     m.innerHTML = viewHome();
  wireMain();
  $('#tabLib').classList.toggle('on', S.view==='home'||S.view==='game');
  $('#tabStore').classList.toggle('on', S.view==='store');
  $('#tabCom').classList.toggle('on', S.view==='com');
}

function fbTint(t){
  let n = 0; for(let i=0;i<t.length;i++) n = (n*31 + t.charCodeAt(i)) % 360;
  return 'background:linear-gradient(160deg,hsl('+n+',30%,33%),hsl('+((n+38)%360)+',34%,13%) 74%)';
}
function art(g){
  return g.cover ? '<img src="'+g.cover+'" alt="'+esc(g.title)+'">'
    : '<span class="fb" style="'+fbTint(g.title)+'"><b>'+esc(g.title)+'</b><i>'+esc(g.author||'Unknown author')+'</i></span>';
}
function capsule(g, label){
  return '<button class="cap" data-id="'+g.id+'" title="'+esc(g.title)+'">'+ art(g) +
    (label ? '<span class="lbl">'+esc(label)+'</span>' : '')+
  '</button>';
}

function viewHome(){
  if(!S.games.length){
    return '<div class="empty"><h3>Your library is empty</h3>'+
      '<p>Mist plays HTML games straight from your own files. Add an .html file, give it a name, an author and some art, and it lands here.</p>'+
      '<button class="addgame" data-act="add">+ &nbsp;Add a game</button></div>';
  }
  const list = sorted();
  const played = S.games.filter(g=>g.lastPlayed).sort((a,b)=>b.lastPlayed-a.lastPlayed).slice(0,6);
  let html = '';
  if(played.length && !S.q){
    html += '<section class="shelf"><h2>Recent <span>'+played.length+' of '+S.games.length+'</span></h2>'+
      '<div class="rowscroll">'+ played.map(g=>capsule(g, when(g.lastPlayed))).join('') +'</div></section>';
  }
  html += '<section class="shelf"><h2>'+(S.q?'Search results':'All games')+' <span>'+list.length+'</span></h2></section>'+
          '<div class="grid">'+ list.map(g=>capsule(g, g.secs? playtime(g.secs):'')).join('') +'</div>';
  return html;
}

    '<div class="veil"></div>'+
    '<div class="heroin"><div class="heroart">'+art(g)+'</div>'+

      '<div class="sub">'+(g.author? 'by '+esc(g.author) : 'No author listed')+'</div></div>'+
    '</div>'+

  '<div class="actionbar">'+
    '<button class="playbtn" data-act="play">Play</button>'+
    '<button class="iconbtn" data-act="props" title="Properties">&#9881;</button>'+
    '<div class="stat"><b>'+playtime(g.secs)+'</b>on record</div>'+
    '<div class="stat"><b>'+when(g.lastPlayed)+'</b>last played</div>'+

    '<div>'+

        '<div class="kv"><span>Added to library</span><b>'+when(g.added)+'</b></div>'+
        '<div class="kv"><span>Last played</span><b>'+when(g.lastPlayed)+'</b></div>'+

    '</div>'+
    '<div>'+
      '<div class="card"><h3>Details</h3><div class="in">'+
        '<div class="kv"><span>Author</span><b>'+esc(g.author||'Unknown')+'</b></div>'+
        '<div class="kv"><span>File</span><b>'+esc(g.file||'game.html')+'</b></div>'+

  const feat = S.games.slice().sort((a,b)=>b.added-a.added)[0];

    '</div>'+

function wireMain(){
  const m = $('#main');
  $$('.cap', m).forEach(c=>{
    c.onclick = ()=> openGame(c.dataset.id);
    c.oncontextmenu = (e)=>{ e.preventDefault(); contextMenu(e.clientX, e.clientY, c.dataset.id); };
  });
  $$('[data-act]', m).forEach(b=>{
    b.onclick = (e)=>{
      e.preventDefault();
      const a = b.dataset.act;
      if(a==='add')      addGameModal();
      if(a==='play')     launch(S.sel);
      if(a==='playid')   launch(b.dataset.id);
      if(a==='openid')   openGame(b.dataset.id);
      if(a==='props')    propsModal(S.sel);
      if(a==='replace')  replaceFile(S.sel);
      if(a==='export')   exportGame(S.sel);
      if(a==='remove')   removeGame(S.sel);
      if(a==='settings') settingsModal();
    };
  });
}

/* ---------------- context menu ---------------- */
function killCtx(){ const c=$('#ctx'); if(c) c.remove(); }
function showCtx(x,y,items){
  killCtx();
  const d = document.createElement('div'); d.id='ctx';
  items.forEach(it=>{
    const b=document.createElement('button'); b.textContent=it.label;
    b.onclick=(e)=>{ e.stopPropagation(); killCtx(); it.run(); };
    d.appendChild(b);
  });
  document.body.appendChild(d);
  const w = d.offsetWidth, h = d.offsetHeight;
  d.style.left = Math.min(x, innerWidth-w-8)+'px';
  d.style.top  = Math.min(y, innerHeight-h-8)+'px';
}
function contextMenu(x,y,id){
  showCtx(x,y,[
    {label:'Play', run:()=>launch(id)},
    {label:'Properties…', run:()=>propsModal(id)},
    {label:'Replace game file…', run:()=>replaceFile(id)},
    {label:'Remove from library', run:()=>removeGame(id)}
  ]);
}

/* ---------------- modal helper ---------------- */
let modalEl = null;
function modal(title, bodyHTML, footHTML, wide){
  closeModal();
  const s = document.createElement('div'); s.className='scrim';
  s.innerHTML = '<div class="dlg'+(wide?' wide':'')+'"><div class="hd"><h2>'+esc(title)+'</h2>'+
    '<button data-x="1">&#10005;</button></div><div class="bd">'+bodyHTML+'</div>'+
    (footHTML?'<div class="ft">'+footHTML+'</div>':'')+'</div>';
  s.addEventListener('mousedown', e=>{ if(e.target===s) closeModal(); });
  s.querySelector('[data-x]').onclick = closeModal;
  $('#modals').appendChild(s);
  modalEl = s;
  return s;
}
function closeModal(){ if(modalEl){ modalEl.remove(); modalEl=null; } }

/* ---------------- add a game ---------------- */
function addGameModal(){
  let source = 'file', html = '', fileName = '', cover = null;

  const s = modal('Add a game to your library',
    '<div class="seg"><button data-src="file" class="on">From an HTML file</button><button data-src="paste">Paste the code</button></div>'+
    '<div id="srcFile">'+
      '<div class="drop" id="drop"><b>Drop an .html file here</b>or click to browse your computer<div class="fn" id="fname"></div></div>'+
    '</div>'+
    '<div id="srcPaste" class="hide"><div class="field"><label for="pasteBox">HTML source</label>'+
      '<textarea id="pasteBox" spellcheck="false" style="min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:12px" placeholder="&lt;!DOCTYPE html&gt; …"></textarea></div></div>'+
    '<div class="twocol" style="margin-top:16px">'+
      '<div class="field"><label for="gTitle">Title</label><input id="gTitle" type="text" maxlength="80"></div>'+
      '<div class="field"><label for="gAuthor">Author</label><input id="gAuthor" type="text" maxlength="60" placeholder="Who made it"></div>'+
    '</div>'+
    '<div class="field"><label for="gDesc">Description</label><textarea id="gDesc" maxlength="1200" placeholder="What is it, how do you play it"></textarea></div>'+
    '<div class="field"><label for="gTags">Tags</label><input id="gTags" type="text" placeholder="platformer, pixel art, singleplayer"><div class="hint">Separate with commas.</div></div>'+
    '<div class="field"><label>Library art</label><div class="coverpick">'+
      '<div class="pv" id="cvPv">No art yet</div>'+
      '<div><button class="btn" type="button" id="cvBtn">Choose image</button>'+
      '<div class="hint" style="margin-top:8px">Tall art looks best — it is cropped to a 2:3 capsule like the grid.</div></div>'+
    '</div></div>'+
    '<div class="prog hide" id="instProg"><i></i></div>',
    '<button class="btn" id="cancel">Cancel</button><button class="btn pri" id="install" disabled>Add to library</button>', true);

  const ok = ()=> $('#install').disabled = !((source==='file'? html : $('#pasteBox').value.trim()) && $('#gTitle').value.trim());

  $$('.seg button', s).forEach(b=> b.onclick = ()=>{
    $$('.seg button', s).forEach(x=>x.classList.remove('on')); b.classList.add('on');
    source = b.dataset.src;
    $('#srcFile').classList.toggle('hide', source!=='file');
    $('#srcPaste').classList.toggle('hide', source!=='paste');
    ok();
  });

  async function take(f){
    if(!f) return;
    if(!/\.(html?|htm)$/i.test(f.name)) { toast('That is not an HTML file.', true); return; }
    html = await readText(f); fileName = f.name;
    $('#fname').textContent = f.name + ' — ' + kb(f.size);
    if(!$('#gTitle').value){
      const m = html.match(/<title[^>]*>([^<]+)<\/title>/i);
      $('#gTitle').value = (m ? m[1].trim() : f.name.replace(/\.html?$/i,'').replace(/[-_]+/g,' ')).slice(0,80);
    }
    ok();
  }
  const drop = $('#drop');
  drop.onclick = async ()=> take(await pickFile('.html,.htm,text/html'));
  drop.ondragover = e=>{ e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = ()=> drop.classList.remove('over');
  drop.ondrop = e=>{ e.preventDefault(); drop.classList.remove('over'); take(e.dataTransfer.files[0]); };

  $('#gTitle').oninput = ok;
  $('#pasteBox').oninput = ok;
  $('#cvBtn').onclick = async ()=>{
    const f = await pickFile('image/*'); if(!f) return;
    cover = await fitImage(await readURL(f), 400, 600, 0.85);
    $('#cvPv').innerHTML = '<img src="'+cover+'" alt="">';
  };
  $('#cancel').onclick = closeModal;

  $('#install').onclick = async ()=>{
    const src = source==='file' ? html : $('#pasteBox').value;
    const g = {
      id: uid(),
      title: $('#gTitle').value.trim(),
      author: $('#gAuthor').value.trim(),
      desc: $('#gDesc').value.trim(),
      tags: $('#gTags').value.split(',').map(t=>t.trim()).filter(Boolean).slice(0,8),
      cover: cover,
      file: fileName || 'pasted.html',
      size: new Blob([src]).size,
      added: Date.now(), lastPlayed: 0, secs: 0, launches: 0
    };
    $('#install').disabled = true;
    const bar = $('#instProg'); bar.classList.remove('hide');
    const fill = bar.querySelector('i');
    for(let p=0; p<=100; p+=10){ fill.style.width = p+'%'; await new Promise(r=>setTimeout(r,26)); }
    try{
      await Store.set('g:'+g.id, src);
      S.games.push(g);
      await saveGames();
    }catch(err){
      toast('Could not save that game — the file may be too large for local storage.', true);
      $('#install').disabled = false; bar.classList.add('hide'); return;
    }
    closeModal();
    openGame(g.id);
    toast(g.title + ' is ready to play.');
  };
}

/* ---------------- properties ---------------- */
function propsModal(id){
  const g = game(id); if(!g) return;
  let cover = g.cover;
  const s = modal(g.title + ' — properties',
    '<div class="twocol">'+
      '<div class="field"><label for="pTitle">Title</label><input id="pTitle" type="text" maxlength="80" value="'+esc(g.title)+'"></div>'+
      '<div class="field"><label for="pAuthor">Author</label><input id="pAuthor" type="text" maxlength="60" value="'+esc(g.author||'')+'"></div>'+
    '</div>'+
    '<div class="field"><label for="pDesc">Description</label><textarea id="pDesc" maxlength="1200">'+esc(g.desc||'')+'</textarea></div>'+
    '<div class="field"><label for="pTags">Tags</label><input id="pTags" type="text" value="'+esc((g.tags||[]).join(', '))+'"></div>'+
    '<div class="field"><label>Library art</label><div class="coverpick">'+
      '<div class="pv" id="pPv">'+(g.cover?'<img src="'+g.cover+'" alt="">':'No art yet')+'</div>'+
      '<div><button class="btn" type="button" id="pCv">Choose image</button> '+
      '<button class="btn" type="button" id="pCvX">Clear</button></div>'+
    '</div></div>'+
    '<div class="note">File: '+esc(g.file||'game.html')+' &middot; '+kb(g.size||0)+' &middot; added '+when(g.added)+'</div>',
    '<button class="btn dngr" id="pDel">Remove from library</button><span style="flex:1"></span>'+
    '<button class="btn" id="pCancel">Cancel</button><button class="btn pri" id="pSave">Save changes</button>', true);

  $('#pCv').onclick = async ()=>{
    const f = await pickFile('image/*'); if(!f) return;
    cover = await fitImage(await readURL(f), 400, 600, 0.85);
    $('#pPv').innerHTML = '<img src="'+cover+'" alt="">';
  };
  $('#pCvX').onclick = ()=>{ cover = null; $('#pPv').textContent = 'No art yet'; };
  $('#pCancel').onclick = closeModal;
  $('#pDel').onclick = ()=>{ closeModal(); removeGame(id); };
  $('#pSave').onclick = async ()=>{
    g.title  = $('#pTitle').value.trim() || g.title;
    g.author = $('#pAuthor').value.trim();
    g.desc   = $('#pDesc').value.trim();
    g.tags   = $('#pTags').value.split(',').map(t=>t.trim()).filter(Boolean).slice(0,8);
    g.cover  = cover;
    await saveGames();
    closeModal(); renderSidebar(); render();
    toast('Saved.');
  };
}

async function replaceFile(id){
  const g = game(id); if(!g) return;
  const f = await pickFile('.html,.htm,text/html'); if(!f) return;
  if(!/\.(html?|htm)$/i.test(f.name)) return toast('That is not an HTML file.', true);
  const src = await readText(f);
  await Store.set('g:'+g.id, src);
  g.file = f.name; g.size = f.size;
  await saveGames(); render();
  toast('Updated to ' + f.name + '.');
}

async function exportGame(id){
  const g = game(id); if(!g) return;
  const src = await Store.get('g:'+g.id);
  if(src==null) return toast('That file is missing from storage.', true);
  download(new Blob([src],{type:'text/html'}), (g.file||g.title.replace(/[^\w.-]+/g,'_')+'.html'));
}

function removeGame(id){
  const g = game(id); if(!g) return;
  modal('Remove from library',
    '<p style="font-size:13.5px;line-height:1.7;color:#b9c6d2">Remove <b style="color:#fff">'+esc(g.title)+'</b> from your library? '+
    'The stored copy of the HTML file is deleted from this device. Your original file is untouched.</p>',
    '<button class="btn" id="rCancel">Keep it</button><button class="btn dngr" id="rGo">Remove</button>');
  $('#rCancel').onclick = closeModal;
  $('#rGo').onclick = async ()=>{
    await Store.del('g:'+id);
    S.games = S.games.filter(x=>x.id!==id);
    await saveGames();
    if(S.sel===id){ S.sel=null; S.view='home'; }
    closeModal(); renderSidebar(); render();
    toast(g.title + ' removed.');
  };
}

/* ---------------- settings ---------------- */
function settingsModal(){
  let ava = S.acct.avatar || DEFAVA, tab = 'profile';
  modal('Settings',
    '<div class="settabs"><button data-t="profile" class="on">Profile</button>'+
    '<button data-t="account">Account</button><button data-t="data">Data</button></div>'+

    '<div data-pane="profile">'+
      '<div class="field"><label>Avatar</label><div class="avatarpick">'+
        '<div class="pv"><img id="stAva" src="'+ava+'" alt=""></div>'+
        '<div><button class="btn" type="button" id="stAvaBtn">Choose image</button> '+
        '<button class="btn" type="button" id="stAvaX">Use default</button></div>'+
      '</div></div>'+
      '<div class="field"><label for="stName">Display name</label><input id="stName" type="text" maxlength="40" value="'+esc(S.acct.name||S.acct.user)+'">'+
      '<div class="hint">Shown on your profile and in the top bar. Your sign-in name does not change.</div></div>'+
    '</div>'+

    '<div data-pane="account" class="hide">'+
      '<div class="field"><label>Account name</label><input type="text" value="'+esc(S.acct.user)+'" disabled style="opacity:.6"></div>'+
      '<div class="field"><label for="stOld">Current password</label><input id="stOld" type="password"></div>'+
      '<div class="twocol">'+
        '<div class="field"><label for="stNew">New password</label><input id="stNew" type="password"></div>'+
        '<div class="field"><label for="stNew2">Confirm new password</label><input id="stNew2" type="password"></div>'+
      '</div>'+
      '<button class="btn" id="stPw">Change password</button>'+
      '<div class="note">This password only locks this copy of Mist on this device. Do not reuse a password you care about.</div>'+
    '</div>'+

    '<div data-pane="data" class="hide">'+
      '<div class="field"><label>Library backup</label>'+
        '<button class="btn" id="stBk">Back up to a file</button> <button class="btn" id="stRs">Restore from a file</button>'+
        '<div class="hint" style="margin-top:8px">The backup holds your account, your games and their HTML.</div></div>'+
      '<div class="field"><label>Storage in use</label>'+
        '<div class="note" style="margin-top:0">'+S.games.length+' games &middot; '+
        kb(S.games.reduce((n,g)=>n+(g.size||0),0))+' of HTML &middot; '+
        ({idb:'IndexedDB',ls:'localStorage',ws:'app storage',mem:'memory only (nothing is saved)'})[Store.mode()]+'</div></div>'+
      '<div class="field"><label>Danger zone</label><button class="btn dngr" id="stWipe">Delete everything and start over</button></div>'+
    '</div>',
    '<button class="btn" id="stCancel">Cancel</button><button class="btn pri" id="stSave">Save changes</button>');

  $$('.settabs button').forEach(b=> b.onclick = ()=>{
    tab = b.dataset.t;
    $$('.settabs button').forEach(x=>x.classList.toggle('on', x===b));
    $$('[data-pane]').forEach(p=>p.classList.toggle('hide', p.dataset.pane!==tab));
  });

  $('#stAvaBtn').onclick = async ()=>{
    const f = await pickFile('image/*'); if(!f) return;
    ava = await fitImage(await readURL(f), 128, 128, 0.88);
    $('#stAva').src = ava;
  };
  $('#stAvaX').onclick = ()=>{ ava = DEFAVA; $('#stAva').src = ava; };

  $('#stPw').onclick = async ()=>{
    const o=$('#stOld').value, n=$('#stNew').value, n2=$('#stNew2').value;
    if(hash(o)!==S.acct.pass) return toast('Current password is wrong.', true);
    if(n.length<4) return toast('New password needs at least 4 characters.', true);
    if(n!==n2) return toast('New passwords do not match.', true);
    S.acct.pass = hash(n); await Store.set('account', S.acct);
    $('#stOld').value=$('#stNew').value=$('#stNew2').value='';
    toast('Password changed.');
  };

  $('#stBk').onclick = backup;
  $('#stRs').onclick = restore;
  $('#stWipe').onclick = ()=>{
    closeModal();
    modal('Delete everything',
      '<p style="font-size:13.5px;line-height:1.7;color:#b9c6d2">This deletes your account, every game in your library and all stored HTML on this device. It cannot be undone.</p>',
      '<button class="btn" id="wCancel">Cancel</button><button class="btn dngr" id="wGo">Delete everything</button>');
    $('#wCancel').onclick = closeModal;
    $('#wGo').onclick = async ()=>{
      for(const g of S.games) await Store.del('g:'+g.id);
      await Store.del('games'); await Store.del('account'); await Store.del('session');
      closeModal(); location.reload();
    };
  };

  $('#stCancel').onclick = closeModal;
  $('#stSave').onclick = async ()=>{
    S.acct.name = $('#stName').value.trim() || S.acct.user;
    S.acct.avatar = ava;
    await Store.set('account', S.acct);
    paintUser(); closeModal(); if(S.view==='com') render();
    toast('Profile updated.');
  };
}

/* ---------------- launch settings ---------------- */
function launchSettingsModal(){
  let mode = S.settings.launchMode || 'normal';
  let addr = S.settings.popupAddress || 'blank';

  const s = modal('Launch settings',
    '<div class="field"><label>How games open</label>'+
      '<div class="seg" id="lsMode">'+
        '<button data-v="normal" class="'+(mode==='normal'?'on':'')+'">Normal</button>'+
        '<button data-v="popup" class="'+(mode==='popup'?'on':'')+'">Popup window</button>'+
      '</div>'+
      '<div class="hint">Normal plays the game right here in Mist. Popup window opens it in its own small window instead.</div>'+
    '</div>'+
    '<div class="field" id="lsAddrWrap" style="'+(mode==='popup'?'':'display:none')+'">'+
      '<label>Popup window address bar</label>'+
      '<div class="seg" id="lsAddr">'+
        '<button data-v="blank" class="'+(addr==='blank'?'on':'')+'">about:blank</button>'+
        '<button data-v="direct" class="'+(addr==='direct'?'on':'')+'">Normal URL</button>'+
      '</div>'+
      '<div class="hint">about:blank keeps the popup\'s address bar blank. Normal URL shows the game\'s local file address instead.</div>'+
    '</div>',
    '<button class="btn" id="lsCancel">Cancel</button><button class="btn pri" id="lsSave">Save changes</button>');

  const syncAddrVis = ()=> $('#lsAddrWrap', s).style.display = (mode==='popup') ? '' : 'none';

  $$('#lsMode button', s).forEach(b=> b.onclick = ()=>{
    mode = b.dataset.v;
    $$('#lsMode button', s).forEach(x=>x.classList.toggle('on', x===b));
    syncAddrVis();
  });
  $$('#lsAddr button', s).forEach(b=> b.onclick = ()=>{
    addr = b.dataset.v;
    $$('#lsAddr button', s).forEach(x=>x.classList.toggle('on', x===b));
  });

  $('#lsCancel').onclick = closeModal;
  $('#lsSave').onclick = async ()=>{
    S.settings.launchMode = mode;
    S.settings.popupAddress = addr;
    await Store.set('settings', S.settings);
    closeModal();
    toast('Launch settings saved.');
  };
}

/* ---------------- backup / restore ---------------- */
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function backup(){
  const files = {};
  for(const g of S.games) files['g:'+g.id] = await Store.get('g:'+g.id);
  const data = { mist:1, account:S.acct, games:S.games, files:files, at:Date.now() };
  download(new Blob([JSON.stringify(data)],{type:'application/json'}), 'mist-library.json');
  toast('Backup saved.');
}
async function restore(){
  const f = await pickFile('application/json,.json'); if(!f) return;
  let data;
  try { data = JSON.parse(await readText(f)); } catch(e){ return toast('That file is not a Mist backup.', true); }
  if(!data || !data.mist || !Array.isArray(data.games)) return toast('That file is not a Mist backup.', true);
  for(const k in data.files) await Store.set(k, data.files[k]);
  S.games = data.games;
  await saveGames();
  if(data.account){ S.acct = data.account; await Store.set('account', S.acct); paintUser(); }
  closeModal(); S.view='home'; S.sel=null; renderSidebar(); render();
  toast('Restored ' + data.games.length + ' games.');
}

/* ---------------- play ---------------- */
let session = null;
const IFRAME_PERMS = 'autoplay; gamepad; fullscreen; microphone; clipboard-write';
const IFRAME_SANDBOX = 'allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-pointer-lock allow-downloads';

async function launch(id){
  const g = game(id); if(!g) return;
  const src = await Store.get('g:'+g.id);
  if(src==null) return toast('The file for this game is missing.', true);
  const url = URL.createObjectURL(new Blob([src], {type:'text/html'}));
  g.launches = (g.launches||0)+1;
  g.lastPlayed = Date.now();
  await saveGames();

  if(S.settings.launchMode === 'popup') launchPopup(g, url);
  else launchInline(g, url);
}

function launchInline(g, url){
  $('#playTitle').textContent = g.title + (g.author ? '   ·   ' + g.author : '');
  $('#playClock').textContent = '0:00';
  $('#playFrame').src = url;
  $('#play').classList.remove('hide');
  session = { id:g.id, url:url, start:Date.now(), tick:setInterval(()=>{
    const s = Math.floor((Date.now()-session.start)/1000);
    $('#playClock').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  }, 1000) };
}

function launchPopup(g, url){
  const w = 1024, h = 700;
  const left = Math.max(0, Math.round(((screen.availWidth||screen.width) - w)/2));
  const top  = Math.max(0, Math.round(((screen.availHeight||screen.height) - h)/2));
  const feats = 'width='+w+',height='+h+',left='+left+',top='+top+
    ',menubar=no,toolbar=no,location=no,status=no,directories=no,resizable=yes,scrollbars=yes';

  let win;
  if(S.settings.popupAddress === 'direct'){
    win = window.open(url, '_blank', feats);
  } else {
    win = window.open('about:blank', '_blank', feats);
    if(win){
      win.document.open();
      win.document.write(
        '<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(g.title)+'</title>'+
        '<style>html,body{margin:0;height:100%;background:#0e1319}iframe{position:fixed;inset:0;width:100%;height:100%;border:none}</style>'+
        '</head><body><iframe src="'+url+'" allow="'+IFRAME_PERMS+'" allowfullscreen sandbox="'+IFRAME_SANDBOX+'"></iframe></body></html>'
      );
      win.document.close();
    }
  }

  if(!win){
    URL.revokeObjectURL(url);
    toast('Your browser blocked the popup. Allow popups for Mist and try again.', true);
    return;
  }

  const start = Date.now();
  const poll = setInterval(()=>{
    if(!win.closed) return;
    clearInterval(poll);
    const played = Math.round((Date.now()-start)/1000);
    g.secs = (g.secs||0) + played;
    URL.revokeObjectURL(url);
    saveGames(); renderSidebar(); render();
    if(played>5) toast('Played ' + playtime(played) + ' of ' + g.title + '.');
  }, 800);
}
async function quitGame(){
  if(!session) return;
  clearInterval(session.tick);
  const g = game(session.id);
  if(g) g.secs = (g.secs||0) + Math.round((Date.now()-session.start)/1000);
  const f = $('#playFrame');
  f.src = 'about:blank';
  URL.revokeObjectURL(session.url);
  const played = g ? Math.round((Date.now()-session.start)/1000) : 0;
  session = null;
  $('#play').classList.add('hide');
  await saveGames();
  renderSidebar(); render();
  if(g && played>5) toast('Played ' + playtime(played) + ' of ' + g.title + '.');
}
$('#playBack').onclick = quitGame;
$('#playFs').onclick = ()=>{
  const el = $('#playFrame');
  if(document.fullscreenElement) document.exitFullscreen();
  else if(el.requestFullscreen) el.requestFullscreen();
};

/* ---------------- keyboard ---------------- */
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  if(modalEl) return closeModal();
  if(!$('#play').classList.contains('hide') && !document.fullscreenElement) quitGame();
});
window.addEventListener('beforeunload', ()=>{
  if(session){
    const g = game(session.id);
    if(g){ g.secs = (g.secs||0) + Math.round((Date.now()-session.start)/1000); Store.set('games', S.games); }
  }
});

</script>
